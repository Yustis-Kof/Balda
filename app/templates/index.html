<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Балда</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="user-panel">
        <span id="username">Гость</span>
        <button onclick="logout()">Выйти</button>
    </div>
    
    <div class="game-container">
        <!-- Таймер -->
        <div class="timer" id="timer">01:00</div> <!-- Вернули id для JS -->
        
        <!-- Игровое поле -->
        <div class="board-container">
            <table class="board" id="board"></table> <!-- Вернули id -->
            <div class="selected-word" id="word"></div> <!-- Вернули id -->
        </div>

        <!-- Кнопки управления -->
        <div class="controls" id="controls">
            <button class="btn reset-btn" id="reset-button" onclick="resetLetter()">Сбросить букву</button>
            <div class="selection-controls">
                <button class="btn cancel-btn" onclick="cancelSelection()">Отменить</button>
                <button class="btn submit-btn" onclick="submitWord()">Отправить</button>
            </div>
        </div>

        <!-- Таблица очков -->
        <div class="scoreboard" id="scoreboard">
            <div class="players-header">
                <h3>Игрок 1</h3>
                <h3>Игрок 2</h3>
            </div>
            <div class="scores-container">
                <!-- Для каждого игрока отдельная колонка -->
                <div class="player-column" id="player1-column">
                    <div class="word-list"></div>
                    <div class="score">0</div>
                </div>
                <div class="player-column" id="player2-column">
                    <div class="word-list"></div>
                    <div class="score">0</div>
                </div>
            </div>
            <div class="total-score">Всего: 0</div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
