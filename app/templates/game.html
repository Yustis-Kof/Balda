<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Балда</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Информаця об игре -->
    <div id="game-data" 
        data-game="{{ game_data | tojson | forceescape }}"
        style="display:none;">
    </div>

    <div class="user-panel">
        <span id="current-user">{{ session.get('username', 'Гость') }}</span>
        <button onclick="logout()">Выйти</button>
    </div>
    
    <div class="game-container">
        <h2 id="lobby-title">Лобби #<span id="game-id">-</span></h2>
        
        <!-- Таймер -->
        <div class="timer" id="timer">01:00</div>
        
        <!-- Игровое поле -->
        <div class="board-container">
            <table class="board" id="board"></table>
            <div class="selected-word" id="word"></div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls" id="controls">
            <button class="btn reset-btn" id="reset-button" onclick="resetLetter()">Сбросить букву</button>
            <div class="selection-controls" id="selection-controls">
                <button class="btn cancel-btn" onclick="cancelSelection()">Отменить</button>
                <button class="btn submit-btn" onclick="submitWord()">Отправить</button>
            </div>
        </div>

        <!-- Таблица очков -->
        <div class="scoreboard" id="scoreboard">
            <div class="players-header">
                <h3 id="player1-header">Игрок 1</h3>
                <h3 id="player2-header">Игрок 2</h3>
            </div>
            <div class="scores-container">
                <div class="player-column" id="player1-column">
                    <div class="word-list"></div>
                    <div class="score">0</div>
                </div>
                <div class="player-column" id="player2-column">
                    <div class="word-list"></div>
                    <div class="score">0</div>
                </div>
            </div>
            <div class="total-score">Всего: 0</div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
